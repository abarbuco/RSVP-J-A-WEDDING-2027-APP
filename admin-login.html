<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Login — Annie &amp; Jay</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Jost:wght@400;500;600&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#f6efe2; --paper:#fffcf6; --ink:#2b211a; --ink-soft:#6b5c4e;
    --rust:#7a4a2e; --olive:#556339; --gold-soft:#c99a4a; --line:rgba(43,33,26,.15);
    --bad:#9a5030; --shadow:0 10px 30px rgba(43,33,26,.1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ivory:#231a14; --paper:#2b2019; --ink:#f3e9d8; --ink-soft:#cdb9a2;
      --rust:#d99a6c; --olive:#a3b37a; --gold-soft:#e6c467; --line:rgba(243,233,216,.16);
      --bad:#e2916a; --shadow:0 10px 30px rgba(0,0,0,.35);
    }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--ivory); color:var(--ink);
    font-family:'Jost', ui-sans-serif, system-ui, sans-serif;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  /* Same woven lattice texture as the invitation page, so this still feels
     like part of the wedding site rather than a bare utility screen. */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background-image:
      repeating-linear-gradient(45deg, var(--line) 0 2px, transparent 2px 22px),
      repeating-linear-gradient(-45deg, var(--line) 0 2px, transparent 2px 22px),
      repeating-linear-gradient(45deg, transparent 0 9px, var(--line) 9px 11px, transparent 11px 22px),
      repeating-linear-gradient(-45deg, transparent 0 9px, var(--line) 9px 11px, transparent 11px 22px);
    opacity:.4;
  }
  .trim{
    height:9px;
    background-image:
      linear-gradient(135deg, var(--gold-soft) 25%, transparent 25.5%),
      linear-gradient(225deg, var(--gold-soft) 25%, transparent 25.5%);
    background-size:16px 18px;
    background-repeat:repeat-x;
    background-position:top center;
    opacity:.9;
    position:absolute; top:0; left:0; right:0; border-radius:10px 10px 0 0;
  }
  .card{
    width:100%; max-width:360px; background:var(--paper); border:1px solid var(--line);
    border-radius:10px; padding:40px 28px 32px; text-align:center;
    box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .petal{ position:absolute; opacity:.5; }
  .petal.tl{ top:16px; left:14px; }
  .petal.br{ bottom:14px; right:14px; transform:rotate(180deg); }
  .monogram{
    font-family:'Mrs Saint Delafield', cursive;
    font-size:2.6rem; line-height:1; color:var(--rust); margin:0 0 4px;
  }
  h1{ font-family:'Cormorant Garamond', Georgia, serif; font-weight:600; font-size:1.3rem; margin:0 0 4px; letter-spacing:.02em; }
  .sub{ color:var(--ink-soft); font-size:.85rem; margin:0 0 26px; }
  label{ display:block; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; text-align:left; }
  input[type="password"]{
    width:100%; font-family:'Jost', sans-serif; font-size:1.2rem; padding:14px 16px;
    border:2px solid var(--rust); border-radius:8px; background:var(--ivory); color:var(--ink);
    margin-bottom:16px; text-align:center;
  }
  input[type="password"]:focus{ outline:2px solid var(--gold-soft); outline-offset:1px; }
  input[type="password"]::placeholder{ color:var(--ink-soft); opacity:.7; }
  button{
    width:100%; padding:13px; border-radius:999px; border:1px solid var(--rust);
    background:var(--rust); color:#fff8ee; font-family:'Jost', sans-serif; font-size:1rem;
    letter-spacing:.03em; cursor:pointer;
  }
  button:hover{ background:var(--olive); border-color:var(--olive); }
  button:disabled{ opacity:.6; }
  .msg{ margin-top:14px; font-size:.9rem; color:var(--bad); min-height:1.2em; }
</style>
</head>
<body>
  <div class="card">
    <div class="trim" aria-hidden="true"></div>
    <svg class="petal tl" width="36" height="36" viewBox="0 0 44 44" aria-hidden="true">
      <g fill="var(--paper)" stroke="var(--olive)" stroke-width="1.3">
        <ellipse cx="22" cy="10.5" rx="5" ry="11" transform="rotate(0 22 22)"/>
        <ellipse cx="22" cy="10.5" rx="5" ry="11" transform="rotate(72 22 22)"/>
        <ellipse cx="22" cy="10.5" rx="5" ry="11" transform="rotate(144 22 22)"/>
        <ellipse cx="22" cy="10.5" rx="5" ry="11" transform="rotate(216 22 22)"/>
        <ellipse cx="22" cy="10.5" rx="5" ry="11" transform="rotate(288 22 22)"/>
      </g>
      <circle cx="22" cy="22" r="3.4" fill="var(--gold-soft)"/>
    </svg>
    <svg class="petal br" width="36" height="36" viewBox="0 0 44 44" aria-hidden="true">
      <g fill="var(--paper)" stroke="var(--olive)" stroke-width="1.3">
        <ellipse cx="22" cy="10.5" rx="5" ry="11" transform="rotate(0 22 22)"/>
        <ellipse cx="22" cy="10.5" rx="5" ry="11" transform="rotate(72 22 22)"/>
        <ellipse cx="22" cy="10.5" rx="5" ry="11" transform="rotate(144 22 22)"/>
        <ellipse cx="22" cy="10.5" rx="5" ry="11" transform="rotate(216 22 22)"/>
        <ellipse cx="22" cy="10.5" rx="5" ry="11" transform="rotate(288 22 22)"/>
      </g>
      <circle cx="22" cy="22" r="3.4" fill="var(--gold-soft)"/>
    </svg>

    <p class="monogram">Annie &amp; Jay</p>
    <h1>Wedding Admin</h1>
    <p class="sub">#AJCloseTheGap</p>
    <form id="loginForm">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" autofocus />
      <button type="submit" id="loginBtn">Log In</button>
      <p class="msg" id="loginMsg"></p>
    </form>
  </div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var btn = document.getElementById('loginBtn');
    var msg = document.getElementById('loginMsg');
    var password = document.getElementById('password').value;
    if (!password){ msg.textContent = 'Please enter the password.'; return; }
    btn.disabled = true; btn.textContent = 'Checking…';
    fetch('/api/admin-login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password })
    }).then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
      .then(function(res){
        if (!res.ok){
          btn.disabled = false; btn.textContent = 'Log In';
          msg.textContent = res.data.error || 'Incorrect password.';
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
          return;
        }
        location.reload();
      }).catch(function(){
        btn.disabled = false; btn.textContent = 'Log In';
        msg.textContent = 'Network hiccup — please try again.';
      });
  });
</script>
</body>
</html>
