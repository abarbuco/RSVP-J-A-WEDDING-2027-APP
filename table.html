<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Find Your Table — Annie &amp; Jay</title>
<meta name="description" content="Your table number and the wedding program — Annie &amp; Jay, #AJCloseTheGap." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#f6efe2; --paper:#fffcf6; --ink:#2b211a; --ink-soft:#6b5c4e;
    --rust:#7a4a2e; --olive:#556339; --gold-soft:#c99a4a; --line:rgba(43,33,26,.15);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ivory:#231a14; --paper:#2b2019; --ink:#f3e9d8; --ink-soft:#cdb9a2;
      --rust:#d99a6c; --olive:#a3b37a; --gold-soft:#e6c467; --line:rgba(243,233,216,.16);
    }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--ivory); color:var(--ink);
    font-family:'Jost', ui-sans-serif, system-ui, sans-serif;
    padding:28px 18px 60px;
  }
  .wrap{ max-width:520px; margin:0 auto; }
  h1{ font-family:'Cormorant Garamond', Georgia, serif; font-weight:600; font-size:2.1rem; margin:0 0 4px; text-align:center; }
  .sub{ color:var(--ink-soft); font-size:1rem; margin:0 0 26px; text-align:center; }

  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:26px 22px; margin-bottom:22px; text-align:center;
  }
  .greeting{ font-size:1.15rem; margin:0 0 14px; }
  .hint{ font-size:1rem; color:var(--ink-soft); margin-top:8px; }

  .party-list{ display:flex; flex-direction:column; gap:14px; }
  .party-member{
    background:var(--ivory); border:1px solid var(--line); border-radius:8px;
    padding:16px 18px; text-align:left;
  }
  .pm-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .pm-name{ font-family:'Cormorant Garamond', Georgia, serif; font-weight:600; font-size:1.25rem; }
  .pm-table{ font-family:'Cormorant Garamond', serif; font-weight:600; color:var(--rust); font-size:1.3rem; white-space:nowrap; }
  .pm-table.unassigned{ font-family:'Jost', sans-serif; font-weight:400; font-size:.85rem; color:var(--ink-soft); }
  .pm-checkin-status{ margin:10px 0 0; font-size:1rem; font-weight:600; color:var(--olive); }

  .searchcard input[type="text"]{
    width:100%; font-family:'Jost', sans-serif; font-size:1.15rem; padding:14px 16px;
    border:1px solid var(--line); border-radius:8px; background:var(--ivory); color:var(--ink);
    margin-bottom:12px; text-align:center;
  }
  .btn{
    display:inline-block; width:100%; padding:14px; border-radius:8px; border:1px solid var(--rust);
    background:var(--rust); color:#fff8ee; font-family:'Jost', sans-serif; font-size:1.05rem;
    cursor:pointer;
  }
  .btn:disabled{ opacity:.6; }
  .msg{ margin-top:14px; font-size:1rem; }
  .msg.error{ color:var(--rust); }
  .candidates{ margin-top:10px; font-size:.95rem; color:var(--ink-soft); }
  .candidates button{
    display:block; width:100%; margin-top:8px; padding:10px; border-radius:8px;
    border:1px solid var(--line); background:var(--ivory); color:var(--ink); font-size:1rem; cursor:pointer;
  }

  .qr-upload-divider{
    display:flex; align-items:center; gap:10px; margin:18px 0 14px;
    color:var(--ink-soft); font-size:.85rem; text-transform:uppercase; letter-spacing:.08em;
  }
  .qr-upload-divider::before, .qr-upload-divider::after{ content:''; flex:1; height:1px; background:var(--line); }
  .qr-upload-label{
    display:block; width:100%; text-align:center; padding:14px; border-radius:8px;
    border:1px dashed var(--olive); color:var(--olive); font-size:1rem; cursor:pointer;
  }
  .qr-upload-input{ display:none; }

  .program h2{ font-family:'Cormorant Garamond', Georgia, serif; font-size:1.5rem; margin:0 0 14px; text-align:center; }
  .program-list{ display:flex; flex-direction:column; gap:12px; }
  .program-item{
    display:flex; gap:14px; align-items:baseline; border-bottom:1px solid var(--line); padding-bottom:12px;
  }
  .program-item:last-child{ border-bottom:0; padding-bottom:0; }
  .program-item .time{ flex:0 0 auto; min-width:78px; font-weight:600; color:var(--rust); font-size:1.05rem; }
  .program-item .title{ font-size:1.05rem; }
  .program-empty{ text-align:center; color:var(--ink-soft); font-style:italic; }

  .backlink{ display:block; text-align:center; margin-top:26px; color:var(--ink-soft); font-size:.95rem; }
  .backlink a{ color:var(--rust); }

  .checkin-btn{
    display:inline-block; width:100%; margin-top:12px; padding:12px; border-radius:8px; border:1px solid var(--olive);
    background:var(--olive); color:#fff8ee; font-family:'Jost', sans-serif; font-size:1rem;
    cursor:pointer;
  }
  .checkin-btn:disabled{ opacity:.6; }
  .checkin-msg{ margin-top:10px; font-size:.9rem; color:var(--ink-soft); line-height:1.5; }
</style>
<script src="/jsQR.js"></script>
</head>
<body>
<div class="wrap">
  <h1>Find Your Table</h1>
  <p class="sub">Annie &amp; Jay · #AJCloseTheGap</p>

  <div class="card" id="lockedNotice" hidden>
    <p class="greeting" style="margin-top:0;">Thank you for celebrating with us!</p>
    <p class="hint">Table lookups are closed — photos are still on the <a href="/">home page</a>.</p>
  </div>

  <div class="card" id="resultCard" hidden></div>

  <div class="card searchcard" id="searchCard" hidden>
    <p class="greeting" style="margin-top:0;">Type your name to find your table</p>
    <input type="text" id="nameInput" placeholder="e.g. Maria Santos" autocomplete="name" />
    <button class="btn" id="searchBtn">Find My Table</button>
    <div class="msg" id="searchMsg"></div>

    <div class="qr-upload-divider"><span>or</span></div>
    <label class="qr-upload-label" for="qrUploadInput">Upload your QR code image</label>
    <input type="file" id="qrUploadInput" accept="image/*" class="qr-upload-input" />
    <div class="msg" id="qrUploadMsg"></div>
  </div>

  <div class="card program">
    <h2>Wedding Program</h2>
    <div class="program-list" id="programList"><p class="program-empty">Loading…</p></div>
  </div>

  <p class="backlink"><a href="/">&larr; Back to the invitation</a></p>
</div>

<script>
  function esc(s){ return String(s == null ? '' : s).replace(/</g, '&lt;'); }

  function fmtTable(t){
    if (!t) return null;
    return /^\d+$/.test(t) ? ('Table ' + t) : t;
  }

  // One QR code (or one name search) shows the WHOLE party together — the
  // person plus anyone they named as additional guests on their RSVP —
  // each with their own table number and their own Check In control.
  function renderPartyMember(m){
    var big = fmtTable(m.table);
    var tableHtml = big
      ? '<span class="pm-table">' + esc(big) + '</span>'
      : '<span class="pm-table unassigned">No table yet</span>';
    var checkinHtml = m.checkedIn
      ? '<p class="pm-checkin-status">&#10003; Checked in</p>'
      : '<button type="button" class="checkin-btn pm-checkin-btn" data-id="' + esc(m.id) + '">Check In</button>' +
        '<p class="checkin-msg" data-msg-for="' + esc(m.id) + '"></p>';
    return '<div class="party-member">' +
      '<div class="pm-row"><span class="pm-name">' + esc(m.name) + '</span>' + tableHtml + '</div>' +
      checkinHtml +
      '</div>';
  }

  function showResult(data){
    var card = document.getElementById('resultCard');
    var party = (data.party && data.party.length) ? data.party : [{ id: data.id, name: data.name, table: data.table, checkedIn: data.checkedIn }];
    var heading = party.length > 1
      ? '<p class="greeting">Welcome! Here\'s your party</p>'
      : '<p class="greeting">Welcome, ' + esc(data.name) + '!</p>';
    card.innerHTML = heading + '<div class="party-list">' + party.map(renderPartyMember).join('') + '</div>';
    card.hidden = false;
  }

  // Re-run whichever lookup produced the result currently on screen — used
  // to refresh everyone's status after any one person in the party checks
  // in, without hand-patching the DOM.
  var lastLookup = null; // { type: 'id'|'name', value }
  function refreshResult(){
    if (!lastLookup) return;
    var req = lastLookup.type === 'id'
      ? fetch('/api/table/' + encodeURIComponent(lastLookup.value))
      : fetch('/api/table?name=' + encodeURIComponent(lastLookup.value));
    req.then(function(r){ return r.json(); }).then(function(data){
      if (data.found) showResult(data);
    });
  }

  document.getElementById('resultCard').addEventListener('click', function(e){
    var btn = e.target.closest('.pm-checkin-btn');
    if (!btn) return;
    var id = btn.getAttribute('data-id');
    btn.disabled = true; btn.textContent = 'Checking in…';
    var msgEl = document.querySelector('.checkin-msg[data-msg-for="' + id + '"]');
    fetch('/api/checkin/' + encodeURIComponent(id), { method: 'POST' })
      .then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
      .then(function(res){
        if (res.ok && res.data.checkedIn){
          refreshResult();
        } else {
          btn.disabled = false; btn.textContent = 'Check In';
          if (msgEl) msgEl.textContent = (res.data && res.data.error) || 'Something went wrong — please try again.';
        }
      }).catch(function(){
        btn.disabled = false; btn.textContent = 'Check In';
        if (msgEl) msgEl.textContent = 'Network hiccup — please try again in a moment.';
      });
  });

  function showNotFound(msg, candidates){
    var card = document.getElementById('searchCard');
    var msgEl = document.getElementById('searchMsg');
    card.hidden = false;
    msgEl.className = 'msg error';
    msgEl.textContent = msg;
    var candWrap = document.getElementById('candList');
    if (candWrap) candWrap.remove();
    if (candidates && candidates.length){
      var wrap = document.createElement('div');
      wrap.className = 'candidates';
      wrap.id = 'candList';
      wrap.innerHTML = '<p>Did you mean:</p>';
      candidates.forEach(function(n){
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = n;
        b.addEventListener('click', function(){ lookupByName(n); });
        wrap.appendChild(b);
      });
      msgEl.after(wrap);
    }
  }

  function lookupByName(name){
    var msgEl = document.getElementById('searchMsg');
    msgEl.className = 'msg';
    msgEl.textContent = 'Looking…';
    var candWrap = document.getElementById('candList');
    if (candWrap) candWrap.remove();
    fetch('/api/table?name=' + encodeURIComponent(name)).then(function(r){ return r.json(); }).then(function(data){
      if (data.found){
        document.getElementById('searchCard').hidden = true;
        msgEl.textContent = '';
        lastLookup = { type: 'name', value: name };
        showResult(data);
      } else if (data.multiple && data.multiple.length){
        showNotFound('A few guests match that name — please pick yours:', data.multiple);
      } else {
        showNotFound("We couldn't find that name on the guest list. Please check the spelling, or ask Annie or Jay.");
      }
    }).catch(function(){
      msgEl.className = 'msg error';
      msgEl.textContent = 'Network hiccup — please try again in a moment.';
    });
  }

  document.getElementById('searchBtn').addEventListener('click', function(){
    var name = document.getElementById('nameInput').value.trim();
    if (!name) return;
    lookupByName(name);
  });
  document.getElementById('nameInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('searchBtn').click();
  });

  // ---------- Upload a saved QR code image (instead of scanning it) ----------
  // Decodes entirely in the guest's own browser — the image is never sent
  // anywhere — then jumps to the same /table/<id> link a live scan would.
  function decodeQrFile(file){
    var msgEl = document.getElementById('qrUploadMsg');
    msgEl.className = 'msg';
    msgEl.textContent = 'Reading your QR code…';
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        var imageData;
        try {
          imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        } catch (e) {
          msgEl.className = 'msg error';
          msgEl.textContent = "Couldn't read that image. Please try again, or type your name instead.";
          return;
        }
        var code = (typeof jsQR === 'function') ? jsQR(imageData.data, imageData.width, imageData.height) : null;
        if (!code || !code.data){
          msgEl.className = 'msg error';
          msgEl.textContent = "We couldn't find a QR code in that photo. Please try a clearer image, or type your name instead.";
          return;
        }
        var dest;
        try {
          var parsed = new URL(code.data, location.href);
          dest = (parsed.origin === location.origin) ? (parsed.pathname + parsed.search) : null;
        } catch (e) {
          dest = null;
        }
        if (!dest || !/^\/table\//.test(dest)){
          msgEl.className = 'msg error';
          msgEl.textContent = "That doesn't look like one of our QR codes. Please try again, or type your name instead.";
          return;
        }
        msgEl.textContent = 'Found it!';
        location.href = dest;
      };
      img.onerror = function(){
        msgEl.className = 'msg error';
        msgEl.textContent = "That doesn't look like an image file. Please try again.";
      };
      img.src = reader.result;
    };
    reader.onerror = function(){
      msgEl.className = 'msg error';
      msgEl.textContent = 'Could not open that file — please try again.';
    };
    reader.readAsDataURL(file);
  }
  document.getElementById('qrUploadInput').addEventListener('change', function(){
    var file = this.files && this.files[0];
    if (file) decodeQrFile(file);
  });

  // ---------- Personal link: /table/<id> ----------
  // Checked against the server's own clock (not this device's), so it lands
  // on the same real-world day for every guest regardless of timezone.
  fetch('/api/settings').then(function(r){ return r.json(); }).then(function(settings){
    if (settings.siteLocked){
      document.getElementById('lockedNotice').hidden = false;
      return;
    }
    runTableLookup();
  }).catch(function(){ runTableLookup(); }); // if settings can't load, fail open rather than locking guests out

  function runTableLookup(){
    var parts = location.pathname.split('/').filter(Boolean);
    var personalId = (parts[0] === 'table' && parts[1]) ? parts[1] : null;

    if (personalId){
      fetch('/api/table/' + encodeURIComponent(personalId)).then(function(r){ return r.json(); }).then(function(data){
        if (data.found){
          lastLookup = { type: 'id', value: personalId };
          showResult(data);
        } else {
          document.getElementById('searchCard').hidden = false;
          showNotFound("We couldn't match this QR code. Please type your name instead:");
        }
      }).catch(function(){
        document.getElementById('searchCard').hidden = false;
      });
    } else {
      document.getElementById('searchCard').hidden = false;
    }
  }

  // ---------- Program ----------
  fetch('/api/program').then(function(r){ return r.json(); }).then(function(data){
    var el = document.getElementById('programList');
    var items = data.program || [];
    if (!items.length){
      el.innerHTML = '<p class="program-empty">The program will be posted here soon.</p>';
      return;
    }
    el.innerHTML = items.map(function(p){
      return '<div class="program-item">' +
        (p.time ? '<span class="time">' + p.time.replace(/</g,'&lt;') + '</span>' : '') +
        '<span class="title">' + p.title.replace(/</g,'&lt;') + '</span></div>';
    }).join('');
  }).catch(function(){
    document.getElementById('programList').innerHTML = '<p class="program-empty">Could not load the program — please refresh.</p>';
  });
</script>
</body>
</html>
